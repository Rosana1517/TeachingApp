name: Update PWA Course Index

on:
  # Fires after any lesson-generation workflow finishes, so the PWA's course
  # list/lesson copies stay in sync without a separate manual step. workflow_run
  # is used instead of `on: push` because pushes made with the default
  # GITHUB_TOKEN (as the generator workflows do) don't trigger push-based
  # workflows — only workflow_run reliably observes them.
  workflow_run:
    workflows:
      - "Generate Daily French Lessons"
      - "Generate Mind Growth Lessons"
      - "Generate Vibe Coding Lessons"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-webapp:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Regenerate courses.json and lesson copies
        run: python scripts/generate_courses_index.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add webapp/courses.json webapp/lessons
          git diff --cached --quiet || git commit -m "Update PWA course index: $(date +%Y-%m-%d)"
          git pull --rebase https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git ${{ github.event.workflow_run.head_branch || github.ref_name }}
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.event.workflow_run.head_branch || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
