name: Update PWA Course Index

on:
  # Manual fallback only. This used to also trigger via `workflow_run` on the
  # three lesson-generator workflows completing, but that never fired in
  # practice (0 runs observed over several days despite the watched workflows
  # completing successfully), leaving the deployed PWA silently stale. The
  # reliable fix was to inline this same regenerate+commit logic directly at
  # the end of each generate-*.yml workflow instead. Kept here for manual
  # re-sync if the index ever drifts (e.g. after editing lesson files by hand).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-webapp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Regenerate courses.json and lesson copies
        run: python scripts/generate_courses_index.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add webapp/courses.json webapp/lessons
          git diff --cached --quiet || git commit -m "Update PWA course index: $(date +%Y-%m-%d)"
          git pull --rebase https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git ${{ github.ref_name }}
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
