name: Deploy to Cloudflare Pages

on:
  # Manual fallback / for direct edits to webapp/ pushed from a local machine
  # (pushes using a real user's git credentials do trigger this; the inline
  # deploy step in each generate-*.yml workflow handles the normal daily
  # lesson-update path, since GITHUB_TOKEN-authored pushes don't retrigger
  # push-based workflows).
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["webapp/**", ".github/workflows/deploy-pages.yml"]

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Pages
        working-directory: webapp
        run: wrangler pages deploy . --project-name=teachingapp --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
