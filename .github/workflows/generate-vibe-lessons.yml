name: Generate Vibe Coding Lessons

on:
  # 改由 cron-job.org 透過 API 呼叫 workflow_dispatch 觸發，
  # 不再依賴 GitHub 自己的 schedule（時間不準、可能被跳過）。
  workflow_dispatch:

permissions:
  contents: write  # 允許寫入 Releases

jobs:
  generate-vibe-lesson:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: Vibe課程

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Generate Vibe Coding lesson
        run: |
          echo "Current directory: $(pwd)"
          echo "Files in directory:"
          ls -la
          echo "Running Python script..."
          python generate_vibe_lesson.py
          echo "Python script completed successfully"
        env:
          LLM_API_URL: ${{ secrets.LLM_API_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}

      - name: Commit and push if changed
        working-directory: .
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add TeachingApp/vibe/vibe-lesson-*.html
          git diff --cached --quiet || git commit -m "Add Vibe Coding lesson: $(date +%Y-%m-%d)"
          git pull --rebase https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git ${{ github.ref }}
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to GitHub Release
        id: upload_release
        working-directory: .
        run: |
          LESSON_FILE=$(ls -t TeachingApp/vibe/vibe-lesson-*.html | head -1)
          TAG_NAME="vibe-lesson-$(echo $LESSON_FILE | sed 's/.*vibe-lesson-\([0-9]*\)\.html/\1/')"
          FILENAME=$(basename "$LESSON_FILE")

          echo "Uploading lesson file: $FILENAME"
          echo "Tag name: $TAG_NAME"

          # Delete existing asset if present (to replace with updated version)
          gh release delete-asset "$TAG_NAME" "$FILENAME" --repo "${{ github.repository }}" --yes 2>/dev/null || true

          # Create or update release with asset
          gh release create "$TAG_NAME" \
            --title "Vibe Coding Lesson $TAG_NAME" \
            --notes "Auto-generated Vibe Coding lesson" \
            --repo "${{ github.repository }}" \
            "$LESSON_FILE" || \
          gh release upload "$TAG_NAME" "$LESSON_FILE" --repo "${{ github.repository }}"

          echo "Release URL: https://github.com/${{ github.repository }}/releases/tag/$TAG_NAME"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Runs inline (rather than via a separate workflow_run-triggered workflow)
      # because workflow_run never fired for these lesson-generator runs in
      # practice, silently leaving the PWA's course list stale.
      - name: Update PWA course index
        working-directory: .
        run: python scripts/generate_courses_index.py

      - name: Commit PWA course index if changed
        working-directory: .
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add webapp/courses.json webapp/lessons
          git diff --cached --quiet || git commit -m "Update PWA course index: $(date +%Y-%m-%d)"
          git pull --rebase https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git ${{ github.ref }}
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Only runs once Cloudflare secrets are configured (see DEPLOY_GITHUB_SECRETS.md);
      # skips quietly otherwise so lesson generation never fails because of it.
      - name: Deploy PWA to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        working-directory: webapp
        run: |
          npm install -g wrangler
          wrangler pages deploy . --project-name=teachingapp --branch=main --commit-dirty=true
